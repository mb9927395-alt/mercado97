<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado97</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      font-size: 40px;
    }

    .idiomas button {
      padding: 12px 18px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .idiomas button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Mercado97</h1>

    <p id="mensaje">
      Tu mercado, fácil y rápido.
    </p>

    <h2 id="titulo">
      Bienvenido a Mercado97
    </h2>

    <div class="idiomas">
      <button onclick="cambiarIdioma('es')">🇪🇸 Español</button>
      <button onclick="cambiarIdioma('pt')">🇧🇷 Português</button>
      <button onclick="cambiarIdioma('en')">🇺🇸 English</button>
    </div>

  </div>

  <script>

    function cambiarIdioma(idioma) {

      if (idioma === "es") {
        document.documentElement.lang = "es";
        document.getElementById("mensaje").textContent =
          "Tu mercado, fácil y rápido.";
        document.getElementById("titulo").textContent =
          "Bienvenido a Mercado97";
      }

      if (idioma === "pt") {
        document.documentElement.lang = "pt-BR";
        document.getElementById("mensaje").textContent =
          "Seu mercado, fácil e rápido.";
        document.getElementById("titulo").textContent =
          "Bem-vindo ao Mercado97";
      }

      if (idioma === "en") {
        document.documentElement.lang = "en-US";
        document.getElementById("mensaje").textContent =
          "Your marketplace, easy and fast.";
        document.getElementById("titulo").textContent =
          "Welcome to Mercado97";
      }
      </script>

</body>
</html>
